name: Mobile
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/prepare.py
      - run: python3 scripts/prepare_native.py
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios
      - run: brew install xcodegen
      - run: python3 scripts/build_ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: .cache/ios-release/*
          if-no-files-found: error
